<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1d" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#4f46e5" stroke-width="6" />

  <!-- Inner Glowing Shield / Badge -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Stylized Staff / Portal Emblem -->
  <!-- Person Head -->
  <circle cx="256" cy="180" r="44" fill="#ffffff" />
  
  <!-- Person Body / Arch -->
  <path d="M 176 310 C 176 250, 336 250, 336 310 L 336 324 C 336 336, 326 346, 314 346 L 198 346 C 186 346, 176 336, 176 324 Z" fill="#ffffff" />

  <!-- Active Attendance Punch Indicator Badge -->
  <circle cx="340" cy="330" r="32" fill="#10b981" stroke="#0b0f1d" stroke-width="6" />
  <!-- Checkmark -->
  <path d="M 328 330 L 336 338 L 354 320" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

